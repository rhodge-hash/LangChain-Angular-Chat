steps:
  # Build and push backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Backend'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/backend-app:$COMMIT_SHA', './backend']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Backend'
    args: ['push', 'gcr.io/$PROJECT_ID/backend-app:$COMMIT_SHA']

  # Deploy backend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy Backend to Cloud Run'
    args:
      - 'run'
      - 'deploy'
      - 'backend-service' # Replace with your Cloud Run service name
      - '--image'
      - 'gcr.io/$PROJECT_ID/backend-app:$COMMIT_SHA'
      - '--region'
      - 'us-central1' # Replace with your desired region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated' # Adjust as needed for authentication
      - '--set-env-vars=JWT_SECRET=${_JWT_SECRET},OPENAI_API_KEY=${_OPENAI_API_KEY}' # Example env vars
      - '--update-secrets=API_KEY=my-api-key:latest' # Example secret access
    secretEnv: ['_JWT_SECRET', '_OPENAI_API_KEY'] # Declare secrets to be used
    entrypoint: gcloud

  # Build and push frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Frontend'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/frontend-app:$COMMIT_SHA', './frontend']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Frontend'
    args: ['push', 'gcr.io/$PROJECT_ID/frontend-app:$COMMIT_SHA']

  # Sync frontend static assets to Cloud Storage
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Extract Frontend Assets'
    args: ['run', '--entrypoint=bash', 'gcr.io/$PROJECT_ID/frontend-app:$COMMIT_SHA', '-c', 'cp -r /usr/share/nginx/html/. /tmp/frontend-dist']
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Sync Frontend to Cloud Storage'
    args: ['storage', 'rsync', '-r', '/tmp/frontend-dist', 'gs://your-frontend-bucket-name'] # Replace with your bucket name
    entrypoint: gcloud

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/JWT_SECRET/versions/latest
    env: '_JWT_SECRET'
  - versionName: projects/$PROJECT_ID/secrets/OPENAI_API_KEY/versions/latest
    env: '_OPENAI_API_KEY'

images:
  - 'gcr.io/$PROJECT_ID/backend-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/frontend-app:$COMMIT_SHA'