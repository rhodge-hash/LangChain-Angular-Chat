<mat-card class="login-card">
  <mat-card-title>Login</mat-card-title>
  <mat-card-content>
    <form (ngSubmit)="onSubmit()" class="login-form">
      <mat-form-field appearance="fill" class="full-width-input">
        <mat-label>Email</mat-label>
        <input matInput type="email" [(ngModel)]="email" name="email" required>
        <mat-error *ngIf="emailControl.invalid && emailControl.touched">
          Please enter a valid email address.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width-input">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="password" name="password" required>
        <mat-error *ngIf="passwordControl.invalid && passwordControl.touched">
          Password is required.
        </mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="!loginForm.valid || isLoading">Login</button>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <p>Don't have an account? <a routerLink="/register">Register here</a></p>
  </mat-card-actions>
</mat-card>
