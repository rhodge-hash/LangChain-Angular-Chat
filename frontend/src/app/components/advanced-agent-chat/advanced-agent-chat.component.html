<mat-card class="advanced-agent-chat-container">
  <mat-card-title>Sophisticated LangChain.js Agent</mat-card-title>

  <mat-card-content>
    <div class="session-info">
      Session ID: <strong>{{ sessionId }}</strong>
      <button mat-raised-button color="accent" (click)="generateNewSessionId()">New Session</button>
    </div>

    <div class="chat-window">
      <div *ngIf="response" class="response-display">
        <strong>Agent:</strong> {{ response }}
      </div>
      <div *ngIf="intermediateSteps.length > 0" class="intermediate-steps">
        <h3>Intermediate Steps:</h3>
        <mat-card *ngFor="let step of intermediateSteps" class="step">
          <p><strong>Tool:</strong> {{ step.tool }}</p>
          <p><strong>Input:</strong> {{ step.toolInput }}</p>
          <p><strong>Observation:</strong> {{ step.observation }}</p>
        </mat-card>
      </div>
      <div *ngIf="isLoading" class="loading-indicator">
        <mat-spinner diameter="30"></mat-spinner>
        <p>Processing...</p>
      </div>
      <div *ngIf="errorMessage" class="error-message">
        Error: {{ errorMessage }}
      </div>
    </div>
  </mat-card-content>

  <mat-card-actions>
    <form (ngSubmit)="onSubmit()" class="prompt-form">
      <mat-form-field appearance="fill" class="full-width-input">
        <mat-label>Enter your prompt...</mat-label>
        <input
          matInput
          type="text"
          [(ngModel)]="prompt"
          name="promptInput"
          [disabled]="isLoading"
        />
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit" [disabled]="isLoading || !prompt.trim()">
        Submit
      </button>
    </form>
  </mat-card-actions>
</mat-card>
