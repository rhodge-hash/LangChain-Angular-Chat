<mat-toolbar color="primary">
  <span>Enhanced Frontend UI/UX</span>
  <span class="spacer"></span>
  <button mat-button routerLink="/login" *ngIf="!isLoggedIn">Login</button>
  <button mat-button routerLink="/register" *ngIf="!isLoggedIn">Register</button>
  <button mat-button (click)="logout()" *ngIf="isLoggedIn">Logout</button>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <!-- Navigation items will go here -->
    <mat-nav-list>
      <a mat-list-item routerLink="/advanced-agent-chat" *ngIf="isLoggedIn">Advanced Agent Chat</a>
      <a mat-list-item routerLink="/agent-chat" *ngIf="isLoggedIn">Agent Chat</a>
      <a mat-list-item routerLink="/blog-generator" *ngIf="isLoggedIn">Blog Generator</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content class="sidenav-content">
    <main class="main">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
